<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Library System</h1>
    <p class="subtitle">Sign in with a seeded test account</p>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" placeholder="you@library.com" />

    <div class="quick-buttons">
      <button type="button" class="link-btn" (click)="quickFill('admin@library.com')">Use Admin</button>
      <button type="button" class="link-btn" (click)="quickFill('user@library.com')">Use Test User</button>
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" class="primary-btn" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
